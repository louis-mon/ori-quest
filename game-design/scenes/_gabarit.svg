<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plan de scene Ori-Quest. Se dessine dans Figma, Inkscape ou Penpot.

  Trois calques : « reperes » (verrouille : grille, cadre, legende), « croquis »
  (dessin libre, ignore a l'import) et « plan » (les boites nommees).

  Un groupe par element ; le NOM du groupe porte son role (hs_, exit_, dec_).
  Chaque boite est groupee avec son etiquette : deplacer l'une deplace l'autre.
  Pour redimensionner le rectangle seul, double-clic pour entrer dans le groupe.

  Tout ce qui n'est pas nomme hs_/exit_/dec_ est ignore a l'import.

      npm run scenes
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="reperes" inkscape:label="reperes" inkscape:groupmode="layer" sodipodi:insensitive="true">
    <rect x="0" y="0" width="1280" height="720" fill="#100e0c" />
    <line x1="80" y1="0" x2="80" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="160" y1="0" x2="160" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="240" y1="0" x2="240" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="320" y1="0" x2="320" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.14" />
    <line x1="400" y1="0" x2="400" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="480" y1="0" x2="480" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="560" y1="0" x2="560" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="640" y1="0" x2="640" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.14" />
    <line x1="720" y1="0" x2="720" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="800" y1="0" x2="800" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="880" y1="0" x2="880" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="960" y1="0" x2="960" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.14" />
    <line x1="1040" y1="0" x2="1040" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="1120" y1="0" x2="1120" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="1200" y1="0" x2="1200" y2="720" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#f2ece1" stroke-width="1" opacity="0.14" />
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#f2ece1" stroke-width="1" opacity="0.05" />
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#f2ece1" stroke-width="1" opacity="0.14" />
    <rect x="0.5" y="0.5" width="1279" height="719" fill="none" stroke="#f2ece1" stroke-width="1" opacity="0.3" />
    <rect x="60" y="24" width="1160" height="672" fill="none" stroke="#f2ece1" stroke-width="1" stroke-dasharray="6 8" opacity="0.18" />
    <text x="66" y="46" font-family="monospace" font-size="13" fill="#f2ece1" opacity="0.55">gabarit — nouvelle scene</text>
    <text x="66" y="66" font-family="monospace" font-size="11" fill="#f2ece1" opacity="0.35">1280x720 · grille 80 px · pointille = zone sure (encoches)</text>
    <text x="66" y="660" font-family="monospace" font-size="12" fill="#c4553d" opacity="0.8">hs_&lt;id&gt;   a examiner</text>
    <text x="66" y="678" font-family="monospace" font-size="12" fill="#f0c987" opacity="0.8">exit_&lt;id&gt; passage vers une autre scene</text>
    <text x="66" y="696" font-family="monospace" font-size="12" fill="#f2ece1" opacity="0.6">dec_&lt;id&gt;  repere de decor (non cliquable)</text>
  </g>
  <g id="croquis" inkscape:label="croquis" inkscape:groupmode="layer">
    <!-- Dessine ici l'allure de la scene : lignes, silhouettes, ce que tu veux.
         Rien de ce calque n'entre dans le jeu. -->
  </g>
  <g id="plan" inkscape:label="plan" inkscape:groupmode="layer">
    <!-- rien encore : dessine tes boites ici -->
  </g>
</svg>
